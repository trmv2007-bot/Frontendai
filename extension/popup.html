<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FrontendAI OS</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      width: 360px;
      background: #0a0a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
    }
    .header {
      display:flex; align-items:center; gap:12px; margin-bottom:16px;
    }
    .logo {
      width:40px; height:40px; border-radius:50%;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      display:flex; align-items:center; justify-content:center;
      font-size:20px;
    }
    h1 { font-size:16px; font-weight:600; }
    .sub { font-size:12px; color:#a1a1aa; margin-top:2px; }
    .card {
      background: #12121a;
      border: 1px solid #1e1e2e;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card h3 { font-size:13px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
    .btn {
      width:100%; padding:10px; border-radius:8px; border:none;
      background: #fff; color:#000; font-weight:600; font-size:13px;
      cursor:pointer; transition: all 0.2s;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn:hover { transform: scale(1.02); }
    .btn-secondary {
      background: #1a1a26; color:#fff; border:1px solid #2a2a3e;
    }
    .btn-violet {
      background: linear-gradient(135deg, #8b5cf6, #ec4899); color:#fff;
    }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .stat { text-align:center; padding:8px; background:#1a1a26; border-radius:8px; }
    .stat b { display:block; font-size:18px; color:#8b5cf6; }
    .stat span { font-size:11px; color:#71717a; }
    .footer { font-size:10px; color:#52525b; text-align:center; margin-top:12px; font-family:monospace; }
    .badge { font-size:10px; background: #8b5cf6/20; color:#a78bfa; border:1px solid #8b5cf6/30; padding:2px 6px; border-radius:999px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🧠</div>
    <div>
      <h1>FrontendAI OS <span class="badge">v9</span></h1>
      <div class="sub">100% frontend • No backend • Private</div>
    </div>
  </div>

  <div class="card">
    <h3>🚀 Quick Open</h3>
    <button class="btn btn-violet" id="openSidePanel">📱 Open Side Panel</button>
    <div style="height:8px"></div>
    <div class="grid">
      <button class="btn btn-secondary" id="injectOrb">🌐 Inject Orb</button>
      <button class="btn btn-secondary" id="openPWA">💻 Open PWA</button>
    </div>
  </div>

  <div class="card">
    <h3>📊 This Tab</h3>
    <div class="grid">
      <div class="stat"><b id="memCount">—</b><span>memories</span></div>
      <div class="stat"><b>18</b><span>tabs</span></div>
    </div>
  </div>

  <div class="card">
    <h3>⌨️ Shortcuts</h3>
    <div style="font-size:11px; color:#a1a1aa; line-height:1.6">
      <div><b>Ctrl+Shift+O</b> — Toggle OS</div>
      <div><b>⌘K</b> — Command palette in PWA</div>
      <div><b>Esc</b> — Close overlay</div>
    </div>
  </div>

  <div class="footer">FrontendAI OS • 100% frontend • IndexedDB • WebGPU • Yjs CRDT • P2P • v9 packaged</div>

  <script src="popup.js" type="module"></script>
</body>
</html>

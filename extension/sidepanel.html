<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FrontendAI OS — Side Panel</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; background:#0a0a0f; overflow:hidden; }
    iframe {
      width:100%; height:100%; border:none; background:#0a0a0f;
    }
    #loading {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:#0a0a0f; color:#8b5cf6; font-family:monospace; font-size:14px;
      z-index:10; transition: opacity 0.5s;
    }
  </style>
</head>
<body>
  <div id="loading">Loading FrontendAI OS...</div>
  <iframe id="os" allow="clipboard-read; clipboard-write; microphone; camera; display-capture; autoplay"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const embedded = params.get('embedded');
    // If inside extension, load the built app from extension dist, otherwise from same origin
    // For dev, if dist doesn't exist, fallback to localhost:5173 or PWA
    const iframe = document.getElementById('os');
    const loading = document.getElementById('loading');

    // Try to load local build first, fallback to remote
    async function getOSUrl() {
      // Check if we have dist/index.html bundled in extension
      try {
        const url = chrome.runtime.getURL('dist/index.html');
        // Test if exists by fetch (chrome extension URLs are accessible)
        const res = await fetch(url, { method: 'HEAD' });
        if (res.ok) return url + '?ext=1&sidepanel=1';
      } catch {}
      // Fallback to extension's own sidepanel app (we will bundle PWA inside extension via build step)
      // If not, use localhost for dev
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        return 'http://localhost:5173/?ext=1&sidepanel=1';
      }
      // Final fallback: use the same origin as sidepanel (which is extension itself) — load inline app
      return './app.html?ext=1&sidepanel=1';
    }

    (async () => {
      // For now, if we're in extension context without dist, create inline minimal app that loads main PWA via iframe to deployed URL
      // Actually best: embed the full app directly in this file via bundling step — for dev we just point to localhost
      let osUrl = await getOSUrl();
      // If we are running as extension page and dist not found, point to the PWA's dev server or production
      if (osUrl.includes('app.html')) {
        // Create inline app: we will inject the built JS via import
        // For packaging, we will have a build step that copies dist into extension/dist
        // So if that copy exists, getOSUrl would have returned it. Since not, we show message
        loading.innerHTML = `
          <div style="text-align:center; padding:20px;">
            <div style="font-size:32px; margin-bottom:12px;">🧠</div>
            <div style="color:#fff; font-weight:600; margin-bottom:8px;">FrontendAI OS</div>
            <div style="color:#71717a; font-size:12px; margin-bottom:16px;">Extension build not found.<br/>Run: npm run build:ext<br/>Or open PWA at localhost:5173</div>
            <button onclick="window.open('http://localhost:5173/','_blank')" style="padding:8px 16px; border-radius:8px; background:#8b5cf6; color:#fff; border:none; cursor:pointer;">Open PWA</button>
          </div>
        `;
        return;
      }
      iframe.src = osUrl;
      iframe.onload = () => {
        loading.style.opacity = '0';
        setTimeout(() => loading.style.display = 'none', 500);
      };
      // Timeout fallback
      setTimeout(() => {
        if (loading.style.display !== 'none') {
          loading.style.opacity = '0';
          setTimeout(() => loading.style.display = 'none', 500);
        }
      }, 3000);
    })();
  </script>
</body>
</html>
